---
layout: default
---
<main class="page">
    <article class="post">
        <div class="post-header">
            <a href="/blog/" class="post-back">&larr; Back to blog</a>
            <h1>{{ page.title }}</h1>
            <div class="post-meta">
                <span>{{ page.date | date: "%B %-d, %Y" }}</span>
                {% for tag in page.tags %}
                <span class="blog-tag">{{ tag }}</span>
                {% endfor %}
            </div>
        </div>

        <div class="post-content">
            {{ content }}
        </div>
    </article>
</main>
