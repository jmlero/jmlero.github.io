---
layout: default
---
<main class="page">
    <article class="container post">
        <header class="post-header">
            <a href="/blog/" class="post-back">&larr; All writing</a>
            <h1>{{ page.title }}</h1>
            <div class="post-meta">
                <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
                {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
            </div>
        </header>
        <div class="post-content">
            {{ content }}
        </div>
        <aside class="post-footer">
            <p>I write about running AI agents in production. Follow along on <a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a> or <a href="{{ site.substack }}" target="_blank" rel="noopener">Substack</a>.</p>
        </aside>
    </article>
</main>
