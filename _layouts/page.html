---
layout: default
---
<main class="page">
    <div class="container">
        <section class="page-header">
            {% if page.label %}<p class="section-label fade-in">{{ page.label }}</p>{% endif %}
            <h1 class="section-title fade-in">{{ page.heading | default: page.title }}</h1>
            {% if page.subtitle %}<p class="section-subtitle fade-in mt-2">{{ page.subtitle }}</p>{% endif %}
        </section>

        <section class="section" style="padding-top: 2rem;">
            {{ content }}
        </section>
    </div>
</main>
