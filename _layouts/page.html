---
layout: default
---
<main class="page">
    <div class="container">
        <section class="page-header">
            {% if page.label %}<p class="eyebrow">{{ page.label }}</p>{% endif %}
            <h1 class="page-title">{{ page.heading | default: page.title }}</h1>
            {% if page.subtitle %}<p class="lead">{{ page.subtitle }}</p>{% endif %}
        </section>
        <section class="page-body">
            {{ content }}
        </section>
    </div>
</main>
