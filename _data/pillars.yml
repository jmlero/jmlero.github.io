- name: Run
  summary: Runtime, sandboxes and gateways where any agent or software factory runs
  points:
    - Agent runtime and isolated sandboxes
    - Gateways for models, MCP tools and agents
    - Teams bring their own agents and factories
    - Golden paths from first agent to production

- name: Govern
  summary: Identity, budgets and policies, on Kubernetes you own
  points:
    - Identity and permissions for every agent
    - Budgets and limits per task and team
    - Policies for every action
    - Any cloud or on-premises, no lock-in

- name: Trust
  summary: "Evals, tracing and evidence: a result counts only with proof"
  points:
    - Checks and an independent review before a result is accepted
    - Tracing, cost and quality per agent
    - Evals for every change in prompts, skills or models
    - Human checkpoints where it matters
